name: Bug report
description: Something in the app behaves incorrectly.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What went wrong, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: If it involves specific file content, paste a minimal sample.
      placeholder: |
        1. Load this Original file...
        2. Load this Candidate file...
        3. Observe...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and OS
      placeholder: e.g. Firefox 128 on macOS 15
    validations:
      required: false
